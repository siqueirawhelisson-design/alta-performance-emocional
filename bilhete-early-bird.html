/* ─────────────────────────────────────────────────────────────
   BILHETE · Alta Performance Emocional
   Cores e tipos vindos dos tokens do site (index.html :root).
   Peca de impressao: assume um so mundo visual, por isso pinta
   todas as cores de forma explicita e nao segue o tema do ecra.
   Medidas em mm para o PDF sair no tamanho real.
   ───────────────────────────────────────────────────────────── */
:root{
  --prata-alto:#F3F1EF;
  --prata:#E8E6E4;
  --prata-2:#CFCBC6;
  --prata-3:#A7A7A8;
  --tinta-2:#14161D;
  --tinta-azul:#3F3F53;
  --laranja:#E2542A;
  --texto-suave:#5C5E68;

  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Outfit","Helvetica Neue",Arial,sans-serif;

  /* geometria do bilhete */
  --w:190mm;
  --h:72mm;
  --figura:40mm;
  --preco:36mm;
  --canhoto:38mm;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:#26282F;color:#F3F1EF;
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}

/* ── area de trabalho, so no ecra ─────────────────────────── */
.barra{
  position:sticky;top:0;z-index:5;
  display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;
  padding:18px clamp(16px,3vw,32px);
  background:#1B1D23;border-bottom:1px solid rgba(243,241,239,.14);
}
.campo{display:flex;flex-direction:column;gap:5px}
.campo label{
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:#A7A7A8;font-weight:600;
}
.campo input{
  width:110px;padding:7px 10px;border-radius:5px;
  border:1px solid rgba(243,241,239,.24);
  background:#26282F;color:#F3F1EF;
  font-family:var(--sans);font-size:14px;font-variant-numeric:tabular-nums;
}
.campo input:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}
.acao{
  padding:9px 18px;border-radius:5px;border:0;cursor:pointer;
  background:var(--laranja);color:#fff;
  font-family:var(--sans);font-size:14px;font-weight:600;
}
.acao:hover{background:#C9481F}
.acao.sec{background:transparent;color:#F3F1EF;border:1px solid rgba(243,241,239,.3)}
.acao.sec:hover{background:rgba(243,241,239,.08)}
.acao:focus-visible{outline:2px solid #F3F1EF;outline-offset:2px}
/* A dica e secundaria pela cor, nao por meio pixel de diferenca:
   a barra tem duas medidas apenas, 10px para rotulos e 14px para
   tudo o resto. */
.dica{
  margin-left:auto;max-width:44ch;
  font-size:14px;line-height:1.5;color:#A7A7A8;
}
.dica b{color:#F3F1EF;font-weight:600}

.palco{padding:clamp(20px,4vw,44px);display:flex;flex-direction:column;align-items:center;gap:10mm}

/* ── folha A4, tres bilhetes ──────────────────────────────── */
.folha{
  width:210mm;min-height:297mm;padding:12mm 10mm;
  background:#fff;
  display:flex;flex-direction:column;gap:8mm;align-items:center;
  box-shadow:0 18px 50px rgba(0,0,0,.4);
}

/* ── o bilhete ────────────────────────────────────────────── */
.bilhete{
  width:var(--w);height:var(--h);flex:none;
  display:flex;position:relative;overflow:hidden;
  background:var(--prata-alto);color:var(--tinta-2);
  border:.25mm solid var(--prata-2);
}

/* bloco central de informacao */
.b-info{
  flex:1;min-width:0;
  padding:6.5mm 7mm 6mm;
  display:flex;flex-direction:column;justify-content:space-between;
}
.b-marca{
  font-family:var(--serif);font-optical-sizing:auto;
  font-size:7.4mm;line-height:1.02;font-weight:400;letter-spacing:-.01em;
  color:var(--tinta-2);margin:0;text-wrap:balance;
}
.b-tagline{
  margin:2.2mm 0 0;font-size:1.9mm;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;color:var(--tinta-azul);
}
.b-detalhes{display:flex;flex-direction:column;gap:2.4mm;margin-top:4mm}
.b-linha{display:flex;gap:3.4mm;align-items:baseline}
.b-rotulo{
  flex:none;width:15mm;
  font-size:1.9mm;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--prata-3);
}
.b-valor{font-size:2.9mm;line-height:1.35;font-weight:400;color:var(--tinta-2)}
.b-valor b{font-weight:600}

/* preco */
.b-preco{
  width:var(--preco);flex:none;
  padding:6.5mm 5mm 6mm;
  display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;
  text-align:right;
  border-left:.25mm solid rgba(20,22,29,.12);
}
.b-preco-bloco{display:flex;flex-direction:column;align-items:flex-end;margin-top:auto}
/* O mesmo numero do canhoto, repetido na metade que o cliente leva.
   Depois de rasgar, as duas partes continuam a identificar-se. */
.b-num{margin-top:auto;text-align:right}
.b-num span{
  display:block;font-size:1.9mm;letter-spacing:.15em;
  text-transform:uppercase;color:var(--prata-3);font-weight:600;
}
.b-num b{
  font-family:var(--sans);font-size:3.6mm;font-weight:600;
  color:var(--tinta-azul);font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
.b-preco-rotulo{
  font-size:1.9mm;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--laranja);
}
.b-preco-valor{
  font-family:var(--serif);font-size:14mm;line-height:.92;font-weight:400;
  color:var(--tinta-2);margin-top:1.6mm;font-variant-numeric:tabular-nums;
}
.b-preco-valor .eur{font-size:5.6mm;margin-left:.6mm}

/* picotado + canhoto */
.b-picotado{
  width:0;flex:none;position:relative;
  border-left:.35mm dashed var(--prata-3);
}
.b-picotado::before,.b-picotado::after{
  content:"";position:absolute;left:-2mm;width:4mm;height:4mm;
  border-radius:50%;background:#fff;
  border:.25mm solid var(--prata-2);
}
.b-picotado::before{top:-2mm}
.b-picotado::after{bottom:-2mm}

.b-canhoto{
  width:var(--canhoto);flex:none;
  padding:6.5mm 5mm 6mm;
  background:var(--prata);
  display:flex;flex-direction:column;justify-content:space-between;
}
.c-marca{
  font-family:var(--serif);font-size:3.6mm;line-height:1.12;
  font-weight:400;color:var(--tinta-2);margin:0;
}
.c-meta{display:flex;flex-direction:column;gap:1.2mm;margin-top:2.5mm}
.c-meta span{
  font-size:1.9mm;letter-spacing:.13em;text-transform:uppercase;
  color:var(--texto-suave);font-weight:600;
}
.c-rodape{display:flex;justify-content:space-between;align-items:flex-end;gap:2mm}
.c-preco{
  font-family:var(--serif);font-size:5.6mm;line-height:1;
  color:var(--tinta-2);font-variant-numeric:tabular-nums;
}
.c-num{text-align:right}
.c-num span{
  display:block;font-size:1.9mm;letter-spacing:.15em;
  text-transform:uppercase;color:var(--prata-3);font-weight:600;
}
.c-num b{
  font-family:var(--sans);font-size:4.4mm;font-weight:600;
  color:var(--laranja);font-variant-numeric:tabular-nums;letter-spacing:.02em;
}

/* guias de corte, opcionais */
.folha.guias .bilhete{outline:.2mm dashed rgba(20,22,29,.35);outline-offset:1.4mm}

/* ── impressao ────────────────────────────────────────────── */
@page{size:A4 portrait;margin:0}
@media print{
  body{background:#fff}
  .barra{display:none}
  .palco{padding:0;gap:0;display:block}
  .folha{
    width:210mm;height:297mm;min-height:0;
    box-shadow:none;margin:0;
    page-break-after:always;break-after:page;
  }
  .folha:last-child{page-break-after:auto;break-after:auto}
  .bilhete{
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .b-figura,.b-canhoto,.b-picotado::before,.b-picotado::after{
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
}
</style>
</head>
<body>

<div class="barra">
  <div class="campo">
    <label for="inicio">Nº inicial</label>
    <input id="inicio" type="number" min="1" max="9999" value="1">
  </div>
  <div class="campo">
    <label for="quantos">Quantidade</label>
    <input id="quantos" type="number" min="1" max="600" value="150">
  </div>
  <button class="acao" id="gerar" type="button">Gerar bilhetes</button>
  <button class="acao sec" id="alternarGuias" type="button">Guias de corte</button>
  <button class="acao sec" id="imprimir" type="button">Imprimir / PDF</button>
  <p class="dica">
    Cada bilhete mede <b>190 × 72 mm</b>, três por folha A4.
    Para imprimir, use <b>Chrome → Imprimir → Guardar como PDF</b>,
    com margens em <b>Nenhuma</b> e <b>Gráficos de fundo</b> ligados.
  </p>
</div>

<div class="palco" id="palco"></div>

<script>
(function(){
  "use strict";

  var POR_FOLHA = 3;

  var palco = document.getElementById("palco");
  var campoInicio = document.getElementById("inicio");
  var campoQuantos = document.getElementById("quantos");

  function bilhete(numero){
    var el = document.createElement("article");
    el.className = "bilhete";
    el.innerHTML =
      '<div class="b-figura" role="img" aria-label="Figura da identidade Alta Performance Emocional"></div>' +
      '<div class="b-info">' +
        '<div>' +
          '<p class="b-marca">Alta Performance<br>Emocional</p>' +
          '<p class="b-tagline">Das emoções às decisões que transformam</p>' +
        '</div>' +
        '<div class="b-detalhes">' +
          '<div class="b-linha"><span class="b-rotulo">Data</span>' +
            '<span class="b-valor"><b>Sábado, 24 de outubro de 2026</b></span></div>' +
          '<div class="b-linha"><span class="b-rotulo">Horário</span>' +
            '<span class="b-valor">15h00 às 19h00 · portas abrem às 14h30</span></div>' +
          '<div class="b-linha"><span class="b-rotulo">Local</span>' +
            '<span class="b-valor">Auditório do Centro Paroquial de Mafamude<br>Vila Nova de Gaia</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="b-preco">' +
        '<div class="b-preco-bloco">' +
          '<span class="b-preco-rotulo">Early Bird</span>' +
          '<span class="b-preco-valor">25<span class="eur">€</span></span>' +
        '</div>' +
        '<span class="b-num"><span>Bilhete</span><b>' + numero + '</b></span>' +
      '</div>' +
      '<div class="b-picotado"></div>' +
      '<div class="b-canhoto">' +
        '<div>' +
          '<p class="c-marca">Alta Performance<br>Emocional</p>' +
          '<div class="c-meta">' +
            '<span>24 · 10 · 2026</span>' +
            '<span>15h00 · Mafamude</span>' +
          '</div>' +
        '</div>' +
        '<div class="c-rodape">' +
          '<span class="c-preco">25 €</span>' +
          '<span class="c-num"><span>Bilhete</span><b>' + numero + '</b></span>' +
        '</div>' +
      '</div>';
    return el;
  }

  function gerar(){
    var inicio = Math.max(1, parseInt(campoInicio.value, 10) || 1);
    var quantos = Math.min(600, Math.max(1, parseInt(campoQuantos.value, 10) || 1));
    var guias = palco.querySelector(".folha.guias") !== null;

    palco.textContent = "";
    var folha = null;

    for (var i = 0; i < quantos; i++){
      if (i % POR_FOLHA === 0){
        folha = document.createElement("div");
        folha.className = "folha" + (guias ? " guias" : "");
        palco.appendChild(folha);
      }
      var n = String(inicio + i).padStart(3, "0");
      folha.appendChild(bilhete(n));
    }
  }

  document.getElementById("gerar").addEventListener("click", gerar);
  document.getElementById("imprimir").addEventListener("click", function(){ window.print(); });
  document.getElementById("alternarGuias").addEventListener("click", function(){
    var folhas = palco.querySelectorAll(".folha");
    for (var i = 0; i < folhas.length; i++){ folhas[i].classList.toggle("guias"); }
  });

  campoInicio.addEventListener("change", gerar);
  campoQuantos.addEventListener("change", gerar);

  gerar();
})();
</script>

</body>
</html>
